    <script>
      (function(){
        var t=localStorage.getItem('krkn-theme')||'dark';
        if(t==='dark')document.documentElement.classList.add('dark');
        var f=localStorage.getItem('krkn-font');
        if(f)document.documentElement.style.setProperty('--app-font-sans',f);
      })();
    </script>

  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
