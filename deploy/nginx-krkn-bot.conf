# KRKN.BOT — Nginx site config
#
# Pasang sebagai: /etc/nginx/sites-available/krkn-bot
# Aktifkan:       sudo ln -s /etc/nginx/sites-available/krkn-bot /etc/nginx/sites-enabled/
#
# Konfigurasi ini TIDAK menyentuh /etc/nginx/sites-enabled/arbit sama sekali.

server {
    listen 80;
    server_name krkn.vooi.lol;

    # Certbot akan mengisi blok listen 443 + ssl_certificate di bawah
    # setelah kamu menjalankan: sudo certbot --nginx -d krkn.vooi.lol

    # Frontend — hasil build Vite (static)
    root /opt/krkn-bot/artifacts/kraken-bot/dist/public;
    index index.html;

    # API — proxy ke Express (hanya listen di localhost)
    location /api/ {
        proxy_pass http://127.0.0.1:8080;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 120s;
    }

    # SPA fallback
    location / {
        try_files $uri $uri/ /index.html;
    }
}
