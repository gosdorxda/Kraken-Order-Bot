openapi: 3.1.0
info:
  title: Api
  version: 0.1.0
  description: Kraken Top-of-Book Bot API
servers:
  - url: /api
    description: Base API path
tags:
  - name: health
    description: Health operations
  - name: bots
    description: Bot instances management
  - name: account
    description: Kraken account info
paths:
  /healthz:
    get:
      operationId: healthCheck
      tags: [health]
      summary: Health check
      responses:
        "200":
          description: Healthy
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HealthStatus"

  /info:
    get:
      operationId: getServerInfo
      tags: [health]
      summary: Get server public IP and Kraken connection status
      responses:
        "200":
          description: Server info
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ServerInfo"

  /bots:
    get:
      operationId: listBots
      tags: [bots]
      summary: List all bot instances
      responses:
        "200":
          description: All bot instances
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/BotInstance"

    post:
      operationId: createBot
      tags: [bots]
      summary: Create a new bot instance
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/BotConfigInput"
      responses:
        "201":
          description: Bot created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/BotInstance"
        "409":
          description: Bot for this pair already exists
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "400":
          description: Bad request
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  /bots/{botId}:
    get:
      operationId: getBot
      tags: [bots]
      summary: Get a single bot instance
      parameters:
        - name: botId
          in: path
          required: true
          schema:
            type: string
      responses:
        "200":
          description: Bot instance
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/BotInstance"
        "404":
          description: Not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

    delete:
      operationId: deleteBot
      tags: [bots]
      summary: Stop and remove a bot instance
      parameters:
        - name: botId
          in: path
          required: true
          schema:
            type: string
      responses:
        "204":
          description: Deleted
        "404":
          description: Not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  /bots/{botId}/start:
    post:
      operationId: startBot
      tags: [bots]
      summary: Start a bot
      parameters:
        - name: botId
          in: path
          required: true
          schema:
            type: string
      responses:
        "200":
          description: Bot started
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/BotInstance"
        "404":
          description: Not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  /bots/{botId}/stop:
    post:
      operationId: stopBot
      tags: [bots]
      summary: Stop a bot
      parameters:
        - name: botId
          in: path
          required: true
          schema:
            type: string
      responses:
        "200":
          description: Bot stopped
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/BotInstance"
        "404":
          description: Not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  /bots/{botId}/config:
    put:
      operationId: updateBotConfig
      tags: [bots]
      summary: Update bot configuration (only when stopped)
      parameters:
        - name: botId
          in: path
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/BotConfigInput"
      responses:
        "200":
          description: Config updated
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/BotInstance"
        "400":
          description: Bad request
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "404":
          description: Not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  /bots/{botId}/logs:
    get:
      operationId: getBotLogs
      tags: [bots]
      summary: Get activity logs for a bot
      parameters:
        - name: botId
          in: path
          required: true
          schema:
            type: string
        - name: limit
          in: query
          schema:
            type: integer
            default: 50
      responses:
        "200":
          description: Activity logs
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/BotLog"
        "404":
          description: Not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  /bots/{botId}/orderbook:
    get:
      operationId: getBotOrderBook
      tags: [bots]
      summary: Get order book for a bot's pair
      parameters:
        - name: botId
          in: path
          required: true
          schema:
            type: string
      responses:
        "200":
          description: Order book snapshot
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/OrderBook"
        "404":
          description: Not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "500":
          description: Kraken API error
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  /orderbook:
    get:
      operationId: getOrderBook
      tags: [bots]
      summary: Get order book for any pair (no bot required)
      parameters:
        - name: pair
          in: query
          required: true
          schema:
            type: string
      responses:
        "200":
          description: Order book snapshot
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/OrderBook"
        "400":
          description: Missing pair
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "500":
          description: Kraken API error
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  /account/balance:
    get:
      operationId: getAccountBalance
      tags: [account]
      summary: Get Kraken account balance
      responses:
        "200":
          description: Account balances
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/AssetBalance"
        "500":
          description: Kraken API error
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

components:
  schemas:
    HealthStatus:
      type: object
      required: [status]
      properties:
        status:
          type: string

    ErrorResponse:
      type: object
      required: [error]
      properties:
        error:
          type: string

    BotConfig:
      type: object
      required: [pair, orderSize, maxBidPrice, tickSize, checkIntervalMs, oneShotMode]
      properties:
        pair:
          type: string
        orderSize:
          type: string
        maxBidPrice:
          type: string
        tickSize:
          type: string
        checkIntervalMs:
          type: integer
          default: 3000
        oneShotMode:
          type: boolean
          default: false
          description: If true, bot stops automatically after the first order is filled

    BotConfigInput:
      type: object
      required: [pair, orderSize, maxBidPrice, tickSize]
      properties:
        pair:
          type: string
        orderSize:
          type: string
        maxBidPrice:
          type: string
        tickSize:
          type: string
        checkIntervalMs:
          type: integer
          default: 3000
        oneShotMode:
          type: boolean
          default: false
          description: If true, bot stops automatically after the first order is filled

    BotStatus:
      type: object
      required: [running, currentOrderId, currentOrderPrice, currentOrderVolume, topBidPrice, topBidOwner, cycleCount, lastAction, lastActionAt]
      properties:
        running:
          type: boolean
        currentOrderId:
          type: ["string", "null"]
        currentOrderPrice:
          type: ["string", "null"]
        currentOrderVolume:
          type: ["string", "null"]
        topBidPrice:
          type: ["string", "null"]
        topBidOwner:
          type: string
          enum: [bot, other, none]
        cycleCount:
          type: integer
        lastAction:
          type: ["string", "null"]
        lastActionAt:
          type: ["string", "null"]

    BotInstance:
      type: object
      required: [id, config, status]
      properties:
        id:
          type: string
        config:
          $ref: "#/components/schemas/BotConfig"
        status:
          $ref: "#/components/schemas/BotStatus"

    BotLog:
      type: object
      required: [id, timestamp, level, message]
      properties:
        id:
          type: integer
        timestamp:
          type: string
        level:
          type: string
          enum: [info, warn, error, success]
        message:
          type: string
        data:
          type: ["string", "null"]

    OrderBook:
      type: object
      required: [pair, bids, asks, timestamp]
      properties:
        pair:
          type: string
        bids:
          type: array
          items:
            $ref: "#/components/schemas/OrderBookLevel"
        asks:
          type: array
          items:
            $ref: "#/components/schemas/OrderBookLevel"
        timestamp:
          type: string

    OrderBookLevel:
      type: object
      required: [price, volume]
      properties:
        price:
          type: string
        volume:
          type: string

    ServerInfo:
      type: object
      required: [publicIp, ipError, krakenConnected, krakenError]
      properties:
        publicIp:
          type: ["string", "null"]
        ipError:
          type: ["string", "null"]
        krakenConnected:
          type: boolean
        krakenError:
          type: ["string", "null"]

    AssetBalance:
      type: object
      required: [asset, balance]
      properties:
        asset:
          type: string
        balance:
          type: string
