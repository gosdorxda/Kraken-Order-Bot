openapi: 3.1.0
info:
  title: Api
  version: 0.1.0
  description: Kraken Top-of-Book Bot API
servers:
  - url: /api
    description: Base API path
tags:
  - name: health
    description: Health operations
  - name: auth
    description: Authentication
  - name: bots
    description: Bot instances management
  - name: account
    description: Kraken account info
  - name: settings
    description: App-level settings
paths:
  /auth/login:
    post:
      operationId: authLogin
      tags: [auth]
      summary: Login with dashboard password
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/LoginRequest"
      responses:
        "200":
          description: Login successful
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/LoginResponse"
        "401":
          description: Wrong password
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  /auth/verify:
    get:
      operationId: authVerify
      tags: [auth]
      summary: Verify token is still valid
      responses:
        "200":
          description: Token valid
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/VerifyResponse"
        "401":
          description: Token invalid
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  /healthz:
    get:
      operationId: healthCheck
      tags: [health]
      summary: Health check
      responses:
        "200":
          description: Healthy
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HealthStatus"

  /info:
    get:
      operationId: getServerInfo
      tags: [health]
      summary: Get server public IP and Kraken connection status
      responses:
        "200":
          description: Server info
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ServerInfo"

  /bots:
    get:
      operationId: listBots
      tags: [bots]
      summary: List all bot instances
      responses:
        "200":
          description: All bot instances
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/BotInstance"

    post:
      operationId: createBot
      tags: [bots]
      summary: Create a new bot instance
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/BotConfigInput"
      responses:
        "201":
          description: Bot created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/BotInstance"
        "409":
          description: Bot for this pair already exists
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "400":
          description: Bad request
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  /bots/{botId}:
    get:
      operationId: getBot
      tags: [bots]
      summary: Get a single bot instance
      parameters:
        - name: botId
          in: path
          required: true
          schema:
            type: string
      responses:
        "200":
          description: Bot instance
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/BotInstance"
        "404":
          description: Not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

    delete:
      operationId: deleteBot
      tags: [bots]
      summary: Stop and remove a bot instance
      parameters:
        - name: botId
          in: path
          required: true
          schema:
            type: string
      responses:
        "204":
          description: Deleted
        "404":
          description: Not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  /bots/{botId}/start:
    post:
      operationId: startBot
      tags: [bots]
      summary: Start a bot
      parameters:
        - name: botId
          in: path
          required: true
          schema:
            type: string
      responses:
        "200":
          description: Bot started
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/BotInstance"
        "404":
          description: Not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  /bots/{botId}/stop:
    post:
      operationId: stopBot
      tags: [bots]
      summary: Stop a bot
      parameters:
        - name: botId
          in: path
          required: true
          schema:
            type: string
      responses:
        "200":
          description: Bot stopped
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/BotInstance"
        "404":
          description: Not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  /bots/{botId}/config:
    put:
      operationId: updateBotConfig
      tags: [bots]
      summary: Update bot configuration (only when stopped)
      parameters:
        - name: botId
          in: path
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/BotConfigInput"
      responses:
        "200":
          description: Config updated
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/BotInstance"
        "400":
          description: Bad request
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "404":
          description: Not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  /bots/{botId}/logs:
    get:
      operationId: getBotLogs
      tags: [bots]
      summary: Get activity logs for a bot
      parameters:
        - name: botId
          in: path
          required: true
          schema:
            type: string
        - name: limit
          in: query
          schema:
            type: integer
            default: 50
      responses:
        "200":
          description: Activity logs
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/BotLog"
        "404":
          description: Not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  /logs:
    get:
      operationId: getAllLogs
      tags: [bots]
      summary: Get aggregated activity logs across all bots
      parameters:
        - name: limit
          in: query
          schema:
            type: integer
            default: 500
      responses:
        "200":
          description: Aggregated activity logs
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/LogEntry"

  /bots/fills:
    get:
      operationId: getAllFills
      tags: [bots]
      summary: Get fill history for all bots
      parameters:
        - name: limit
          in: query
          schema:
            type: integer
            default: 200
      responses:
        "200":
          description: Fill records from all bots
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/FillRecord"

  /bots/{botId}/fills:
    get:
      operationId: getBotFills
      tags: [bots]
      summary: Get fill history for a bot
      parameters:
        - name: botId
          in: path
          required: true
          schema:
            type: string
        - name: limit
          in: query
          schema:
            type: integer
            default: 50
      responses:
        "200":
          description: Fill records
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/FillRecord"
        "404":
          description: Not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  /bots/{botId}/orderbook:
    get:
      operationId: getBotOrderBook
      tags: [bots]
      summary: Get order book for a bot's pair
      parameters:
        - name: botId
          in: path
          required: true
          schema:
            type: string
      responses:
        "200":
          description: Order book snapshot
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/OrderBook"
        "404":
          description: Not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "500":
          description: Kraken API error
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  /orderbook:
    get:
      operationId: getOrderBook
      tags: [bots]
      summary: Get order book for any pair (no bot required)
      parameters:
        - name: pair
          in: query
          required: true
          schema:
            type: string
        - name: exchange
          in: query
          required: false
          schema:
            type: string
            enum: [kraken, xt]
            default: kraken
      responses:
        "200":
          description: Order book snapshot
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/OrderBook"
        "400":
          description: Missing pair
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "500":
          description: Kraken API error
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  /market:
    get:
      operationId: getMarket
      tags: [bots]
      summary: Get all USD spot pairs with ticker data
      responses:
        "200":
          description: Market tickers
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/MarketTicker"
        "500":
          description: Kraken API error
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  /market/gate:
    get:
      operationId: getMarketGate
      tags: [bots]
      summary: Get all USDT spot pairs from Gate.io with ticker data
      responses:
        "200":
          description: Gate.io market tickers
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/MarketTicker"
        "500":
          description: Gate.io API error
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  /market/lbank:
    get:
      operationId: getMarketLbank
      tags: [bots]
      summary: Get all USDT spot pairs from LBank with ticker data
      responses:
        "200":
          description: LBank market tickers
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/MarketTicker"
        "500":
          description: LBank API error
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  /market/ascendex:
    get:
      operationId: getMarketAscendex
      tags: [bots]
      summary: Get all USDT spot pairs from AscendEX with ticker data
      responses:
        "200":
          description: AscendEX market tickers
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/MarketTicker"
        "500":
          description: AscendEX API error
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  /market/xt:
    get:
      operationId: getMarketXt
      tags: [bots]
      summary: Get all USDT spot pairs from XT.com with ticker data
      responses:
        "200":
          description: XT.com market tickers
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/MarketTicker"
        "500":
          description: XT.com API error
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  /settings:
    get:
      operationId: getSettings
      tags: [settings]
      summary: Get app-level settings
      responses:
        "200":
          description: App settings
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AppSettings"
    patch:
      operationId: updateSettings
      tags: [settings]
      summary: Update app-level settings
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/AppSettingsPatch"
      responses:
        "200":
          description: Updated settings
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AppSettings"
        "400":
          description: Validation error
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  /telegram/settings:
    get:
      operationId: getTelegramSettings
      tags: [bots]
      summary: Get Telegram notification event settings
      responses:
        "200":
          description: Current Telegram notification settings
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/TelegramSettings"

    put:
      operationId: updateTelegramSettings
      tags: [bots]
      summary: Update Telegram notification event settings
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/TelegramSettingsInput"
      responses:
        "200":
          description: Updated Telegram notification settings
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/TelegramSettings"
        "400":
          description: Bad request
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  /account/xt-balance:
    get:
      operationId: getXtBalance
      tags: [account]
      summary: Get XT.com account balance
      responses:
        "200":
          description: XT account balances
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/XtAssetBalance"
        "500":
          description: XT API error
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  /account/balance:
    get:
      operationId: getAccountBalance
      tags: [account]
      summary: Get Kraken account balance
      responses:
        "200":
          description: Account balances
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/AssetBalance"
        "500":
          description: Kraken API error
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

components:
  schemas:
    TelegramNotificationSettings:
      type: object
      required: [fill, circuitBreaker, botStartStop]
      properties:
        fill:
          type: boolean
        circuitBreaker:
          type: boolean
        botStartStop:
          type: boolean

    AppSettings:
      type: object
      required: [telegramNotifications]
      properties:
        telegramNotifications:
          $ref: "#/components/schemas/TelegramNotificationSettings"

    AppSettingsPatch:
      type: object
      properties:
        telegramNotifications:
          $ref: "#/components/schemas/TelegramNotificationSettings"

    LoginRequest:
      type: object
      required: [password]
      properties:
        password:
          type: string

    LoginResponse:
      type: object
      required: [token]
      properties:
        token:
          type: string

    VerifyResponse:
      type: object
      required: [ok]
      properties:
        ok:
          type: boolean

    HealthStatus:
      type: object
      required: [status]
      properties:
        status:
          type: string

    ErrorResponse:
      type: object
      required: [error]
      properties:
        error:
          type: string

    BotConfig:
      type: object
      required: [pair, orderSize, maxBidPrice, tickSize, checkIntervalMs, oneShotMode, maxConsecutiveErrors]
      properties:
        pair:
          type: string
        orderSize:
          type: string
        maxBidPrice:
          type: string
        tickSize:
          type: string
        checkIntervalMs:
          type: integer
          default: 3000
        oneShotMode:
          type: boolean
          default: false
        maxConsecutiveErrors:
          type: integer
          default: 5
        exchange:
          type: string
          enum: [kraken, xt]
          default: kraken

    BotConfigInput:
      type: object
      required: [pair, orderSize, maxBidPrice, tickSize]
      properties:
        pair:
          type: string
        orderSize:
          type: string
        maxBidPrice:
          type: string
        tickSize:
          type: string
        checkIntervalMs:
          type: integer
          default: 3000
        oneShotMode:
          type: boolean
          default: false
        maxConsecutiveErrors:
          type: integer
          default: 5
        exchange:
          type: string
          enum: [kraken, xt]
          default: kraken

    BotStatus:
      type: object
      required: [running, currentOrderId, currentOrderPrice, currentOrderVolume, topBidPrice, topBidOwner, cycleCount, lastAction, lastActionAt, circuitBreakerTripped, consecutiveErrors]
      properties:
        running:
          type: boolean
        currentOrderId:
          type: ["string", "null"]
        currentOrderPrice:
          type: ["string", "null"]
        currentOrderVolume:
          type: ["string", "null"]
        topBidPrice:
          type: ["string", "null"]
        topBidOwner:
          type: string
          enum: [bot, other, none]
        cycleCount:
          type: integer
        lastAction:
          type: ["string", "null"]
        lastActionAt:
          type: ["string", "null"]
        circuitBreakerTripped:
          type: boolean
        consecutiveErrors:
          type: integer

    BotInstance:
      type: object
      required: [id, config, status]
      properties:
        id:
          type: string
        config:
          $ref: "#/components/schemas/BotConfig"
        status:
          $ref: "#/components/schemas/BotStatus"

    BotLog:
      type: object
      required: [id, timestamp, level, message]
      properties:
        id:
          type: integer
        timestamp:
          type: string
        level:
          type: string
          enum: [info, warn, error, success]
        message:
          type: string
        data:
          type: ["string", "null"]

    LogEntry:
      type: object
      required: [id, botId, timestamp, level, message]
      properties:
        id:
          type: integer
        botId:
          type: string
        timestamp:
          type: string
        level:
          type: string
          enum: [info, warn, error, success]
        message:
          type: string
        data:
          type: ["string", "null"]

    MarketTicker:
      type: object
      required: [pair, displayName, bid, ask, last, open24h, change24h, spread, spreadPct, volume24h, high24h, low24h]
      properties:
        pair:
          type: string
        displayName:
          type: string
        bid:
          type: string
        ask:
          type: string
        last:
          type: string
        open24h:
          type: string
        change24h:
          type: number
        spread:
          type: string
        spreadPct:
          type: number
        volume24h:
          type: string
        high24h:
          type: string
        low24h:
          type: string

    FillRecord:
      type: object
      required: [id, pair, orderId, price, volume, timestamp]
      properties:
        id:
          type: integer
        botId:
          type: string
        pair:
          type: string
        orderId:
          type: string
        price:
          type: string
        volume:
          type: string
        timestamp:
          type: string

    OrderBook:
      type: object
      required: [pair, bids, asks, timestamp]
      properties:
        pair:
          type: string
        bids:
          type: array
          items:
            $ref: "#/components/schemas/OrderBookLevel"
        asks:
          type: array
          items:
            $ref: "#/components/schemas/OrderBookLevel"
        timestamp:
          type: string

    OrderBookLevel:
      type: object
      required: [price, volume]
      properties:
        price:
          type: string
        volume:
          type: string

    ServerInfo:
      type: object
      required: [publicIp, ipError, krakenConnected, krakenError, xtConnected, xtError]
      properties:
        publicIp:
          type: ["string", "null"]
        ipError:
          type: ["string", "null"]
        krakenConnected:
          type: boolean
        krakenError:
          type: ["string", "null"]
        xtConnected:
          type: boolean
        xtError:
          type: ["string", "null"]

    AssetBalance:
      type: object
      required: [asset, balance]
      properties:
        asset:
          type: string
        balance:
          type: string
        used:
          type: string
        free:
          type: string

    XtAssetBalance:
      type: object
      required: [currency, available, frozen]
      properties:
        currency:
          type: string
        available:
          type: string
        frozen:
          type: string

    TelegramSettings:
      type: object
      required: [configured, notifyOnFill, notifyOnCircuitBreaker, notifyOnStartStop]
      properties:
        configured:
          type: boolean
        notifyOnFill:
          type: boolean
        notifyOnCircuitBreaker:
          type: boolean
        notifyOnStartStop:
          type: boolean

    TelegramSettingsInput:
      type: object
      required: [notifyOnFill, notifyOnCircuitBreaker, notifyOnStartStop]
      properties:
        notifyOnFill:
          type: boolean
        notifyOnCircuitBreaker:
          type: boolean
        notifyOnStartStop:
          type: boolean
